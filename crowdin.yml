api_token_env: CROWDIN_TOKEN
project_id_env: CROWDIN_FACTORIO_MODS_ID
preserve_hierarchy: true

files:
  - source: /locale/en/fcpu.cfg
    dest: fcpu/fcpu.ini
    translation: /locale/%two_letters_code%/%original_file_name%
    type: ini
    update_option: update_as_unapproved

    ## Auto section split
    #scheme: "/%original_file_name%/%file_section%.ini"

  - source: /locale/en/errors.cfg
    dest: fcpu/errors.ini
    translation: /locale/%two_letters_code%/%original_file_name%
    type: ini
    update_option: update_as_unapproved
