[mod-name]
fcpu=fCPU: 可编程运算器

[mod-description]
fcpu=Factorio 可编程运算单元.\n\n允许以汇编代码编写任意逻辑.\nfCPU 是一个带有向量协处理器的可编程微控制器,支持许多有用的指令.

[mod-setting-name]
fcpu-maximum-updates-per-tick=最大执行指令数
fcpu-gui-editor-inline-icons=在程序编辑器中显示信号网络图标
fcpu-gui-editor-width=编辑器宽度
fcpu-gui-editor-autoscroll=自动滚动视图
fcpu-gui-updates-every-tick=GUI 刷新率
fcpu-debug-enabled=使能外部调试器
fcpu-debug-mode=调试信息
fcpu-program-lines=程序行数限制

[mod-setting-description]
fcpu-maximum-updates-per-tick=每 tick 最多可执行多少条指令
fcpu-gui-editor-autoscroll=将视图滚动到当前指令所在的行
fcpu-gui-updates-every-tick=每 N 帧更新一次 GUI
fcpu-debug-enabled=显示内部信号(需要 justarandomgeek.factoriomod-debug 模组)
fcpu-debug-mode=调试信息输出形式
fcpu-program-lines=较高的数值可能导致 GUI 无响应

[string-mod-setting]
fcpu-debug-mode-d=禁用
fcpu-debug-mode-c=控制台
fcpu-debug-mode-l=日志文件
fcpu-debug-mode-b=两者

[technology-name]
fcpu=可编程系统

[technology-description]
fcpu=组合运算器与微控制器,构成一个可用软件控制的系统.

[item-name]
fcpu=可编程运算器

[item-description]
fcpu=工作条件:放置在任何表面上,供电并连接信号线.

[entity-name]
fcpu=可编程运算器
imposter-fcpu=可编程控制器的程序

[entity-description]
fcpu=高级信号处理器.允许以汇编代码编写任意逻辑.
imposter-fcpu=用于在蓝图中存储程序的辅助对象.

[virtual-signal-name]
signal-fcpu-halt=暂停程序执行.
signal-fcpu-run=继续运行程序.
signal-fcpu-step=单步执行当前指令.
signal-fcpu-sleep=休眠指定的 tick 数.
signal-fcpu-jump=跳转到程序中的指定行.
signal-fcpu-error=程序执行期间发生错误.

[fcpu-errors]
blueprint-broken=__1__ 会破坏蓝图中的标签.
blueprint-unavailable=__1__ 是蓝图标签,需要改为其它名称.

[controls]
fcpu-debug-stop=暂停
fcpu-debug-start=运行/继续
fcpu-debug-restart=重启
fcpu-debug-pause=暂停
fcpu-debug-step-over=单步跳过
fcpu-debug-step-into=单步进入

