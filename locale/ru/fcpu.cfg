[mod-name]
fcpu=fCPU: Программируемый комбинатор

[mod-description]
fcpu=Factorio Customizable Processing Unit.\n\nПозволяет писать любую логику на ассемблере.\nfCPU действует как программируемый микроконтроллер с векторным сопроцессором, который поддерживает множество полезных инструкций.

