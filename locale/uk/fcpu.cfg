[mod-description]
fcpu=Factorio Customizable Processing Unit.\n\nДозвольте написати будь-яку логіку на низькому рівні машинного коду.\nФактор процесора виконує як програмований мікроконтролер з векторний співпроцесор, який підтримує багато корисних інструкцій.

